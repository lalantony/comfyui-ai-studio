name: Feature request
description: Suggest a new capability, node type, integration, or improvement
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea! Please describe the user-visible outcome first — what should be possible that isn't today.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What can't you do today? Or what's painful? Use a real workflow if you can.
      placeholder: |
        I want to chain three ComfyUI endpoints (upscale → face restore → save) but each one is its own node and the wiring is repetitive.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: Sketch the user-facing UX. Implementation specifics are great if you have them but optional.
      placeholder: |
        A "ComfyUI chain" node that accepts multiple endpointIds and runs them sequentially with the previous output piped in as the next input.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds exist today? Why aren't they good enough?

  - type: dropdown
    id: scope
    attributes:
      label: Area of the app
      multiple: true
      options:
        - Project / Composer
        - Workflow editor / Canvas
        - ComfyUI integration
        - LLM integration
        - Asset management
        - Settings
        - Theme / UX polish
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, links to similar features in other tools, etc.

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I am willing to discuss tradeoffs and refine the proposal during review.
          required: true
